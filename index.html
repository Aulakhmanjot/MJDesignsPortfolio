
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interior Design Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f2eb;
      color: #30382e;
      font-family: Georgia, serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 6%;
    }

    .logo {
      font-size: 17px;
      letter-spacing: 3px;
    }

    nav a {
      margin-left: 25px;
      color: #30382e;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px 70px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 60px);
      font-weight: normal;
      margin: 0 0 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #777b70;
      letter-spacing: 1px;
      margin-bottom: 25px;
    }

    .olive-tree {
      width: 100%;
      max-width: 440px;
      height: auto;
      transition: transform 1.5s ease-in-out;
      animation: appear 1.8s ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .instruction {
      font-size: 15px;
      color: #687260;
      margin-top: 15px;
      font-style: italic;
    }

    #waterButton {
      margin-top: 25px;
      padding: 14px 32px;
      background: #465c45;
      color: white;
      border: none;
      border-radius: 30px;
      font-family: Georgia, serif;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #waterButton:hover {
      background: #2d402e;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px 5%;
      }

      nav a {
        margin-left: 12px;
        font-size: 12px;
      }

      .olive-tree {
        max-width: 340px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">DESIGN STUDIO</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#projects">Projects</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main class="hero" id="home">

    <h1>Design, Naturally.</h1>

    <p class="subtitle">
      Spaces inspired by nature.
    </p>

    <img
      src="olive-tree.png"
      alt="Olive tree in a ceramic planter"
      class="olive-tree"
    >

    <p class="instruction">
      Every great design begins with growth.
    </p>

    <button id="waterButton" onclick="waterTree()">
      💧 Water the Tree
    </button>

  </main>

  <script>
    let growthLevel = 0;

    function waterTree() {
      const tree = document.querySelector(".olive-tree");

      if (growthLevel < 3) {
        growthLevel++;

        tree.style.transform =
          `scale(${1 + growthLevel * 0.08})`;
      }
    }
  </script>

</body>
</html>
